<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#12180F">
<title>Arbeider Archenemy</title>
<style>
  :root{
    --ink:#12180F;
    --ink-deep:#080B06;
    --parchment:#E6D9B8;
    --parchment-hi:#F2E8CB;
    --brass:#A9803E;
    --brass-bright:#D8AE66;
    --ember:#9C4630;
    --moss:#4B6B3A;
    --moss-bright:#7A9B5E;
    --text-dark:#2B2416;
    --text-light:#E9E2CC;
    --muted:#84927E;
    --panel-border:rgba(169,128,62,0.35);
    --font-display:'Copperplate','Herculanum','Trajan Pro',Georgia,'Palatino Linotype',serif;
    --font-body:'Palatino Linotype','Book Antiqua',Palatino,Georgia,'Iowan Old Style',serif;
    --font-ui:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    background: radial-gradient(ellipse at top, #1a2317 0%, var(--ink) 55%, var(--ink-deep) 100%);
    color:var(--text-light);
    font-family:var(--font-ui);
    -webkit-font-smoothing:antialiased;
  }
  #app{max-width:480px;margin:0 auto;min-height:100vh;padding:20px 16px 110px;position:relative;}
  button{font-family:inherit;cursor:pointer;}
  input,textarea{font-family:inherit;}

  /* header */
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;}
  .topbar-left{display:flex;align-items:center;gap:12px;min-width:0;}
  .seal-mini{width:38px;height:38px;flex-shrink:0;}
  .app-title{font-family:var(--font-display);font-size:19px;letter-spacing:0.07em;text-transform:uppercase;color:var(--brass-bright);}
  .app-subtitle{font-size:11px;color:var(--muted);letter-spacing:0.03em;margin-top:2px;}
  .gear-btn{background:none;border:1px solid var(--panel-border);color:var(--brass-bright);font-size:17px;width:34px;height:34px;border-radius:8px;flex-shrink:0;line-height:1;}
  .game-menu{display:flex;flex-direction:column;gap:8px;background:rgba(255,255,255,0.03);border:1px solid var(--panel-border);border-radius:10px;padding:10px;margin-bottom:14px;}

  /* compact turn + eligibility bar */
  .control-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;background:rgba(255,255,255,0.03);border:1px solid var(--panel-border);border-radius:10px;padding:8px 12px;margin-bottom:10px;}
  .turn-mini{display:flex;align-items:center;gap:8px;}
  .turn-mini-label{font-size:13px;color:var(--text-light);}
  .turn-mini-label strong{font-family:var(--font-display);font-size:17px;color:var(--parchment-hi);margin:0 3px;}
  .mini-btn{width:26px;height:26px;border-radius:7px;border:1px solid var(--panel-border);background:rgba(255,255,255,0.03);color:var(--text-light);font-size:15px;line-height:1;padding:0;flex-shrink:0;}
  .eligibility-mini{font-size:11px;white-space:nowrap;}
  .eligibility-mini.lit{color:var(--brass-bright);}
  .eligibility-mini.unlit{color:var(--muted);}

  .btn{padding:10px 16px;border-radius:9px;border:1px solid var(--panel-border);background:rgba(255,255,255,0.03);color:var(--text-light);font-size:14px;}
  .btn-primary{background:linear-gradient(180deg,var(--brass-bright),var(--brass));color:var(--ink-deep);border:1px solid #6b4a1e;font-weight:600;box-shadow:inset 0 1px 0 rgba(255,255,255,0.3),inset 0 -2px 3px rgba(0,0,0,0.2);}
  .btn-primary:disabled{background:#2c2e29;color:var(--muted);border-color:var(--panel-border);box-shadow:none;opacity:0.7;}
  .btn-ghost{background:none;border:1px solid var(--panel-border);color:var(--text-light);}
  .btn-danger{background:none;border:1px solid var(--ember);color:#e0a08f;}
  .btn-block{display:block;width:100%;}

  /* start screen */
  .start-screen{text-align:center;padding:56px 16px 30px;}
  .start-title{font-family:var(--font-display);font-size:21px;color:var(--parchment-hi);margin:16px 0 6px;}
  .start-sub{font-size:13px;color:var(--muted);margin-bottom:26px;}
  .commander-label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;text-align:left;}
  .commander-picker-btn{width:100%;text-align:left;padding:11px 12px;border-radius:9px;border:1px solid var(--panel-border);background:rgba(0,0,0,0.25);color:var(--text-light);font-size:14px;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center;gap:8px;}
  .picker-chevron{color:var(--muted);font-size:10px;flex-shrink:0;}
  .commander-picker-list{background:rgba(0,0,0,0.35);border:1px solid var(--panel-border);border-radius:9px;margin-bottom:14px;overflow:hidden;}
  .commander-picker-option{display:block;width:100%;text-align:left;padding:11px 12px;background:none;border:none;border-bottom:1px solid rgba(255,255,255,0.06);color:var(--text-light);font-size:14px;}
  .commander-picker-option:last-child{border-bottom:none;}
  .commander-picker-option.active{color:var(--brass-bright);background:rgba(216,174,102,0.12);}
  .switch-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:2px 0 8px;}
  .switch-row-label{font-size:13px;color:var(--text-light);flex:1;}
  .switch{position:relative;display:inline-block;width:44px;height:26px;flex-shrink:0;}
  .switch input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer;}
  .switch-track{position:absolute;top:0;left:0;right:0;bottom:0;background:rgba(255,255,255,0.12);border:1px solid var(--panel-border);border-radius:20px;transition:background .15s,border-color .15s;pointer-events:none;}
  .switch-track::before{content:'';position:absolute;height:18px;width:18px;left:3px;top:3px;background:var(--muted);border-radius:50%;transition:transform .15s,background .15s;}
  .switch input:checked ~ .switch-track{background:rgba(216,174,102,0.35);border-color:var(--brass);}
  .switch input:checked ~ .switch-track::before{transform:translateX(18px);background:var(--brass-bright);}
  .rating-prompt{text-align:center;margin:8px 0 22px;}
  .rating-label{font-size:13px;color:var(--muted);margin-bottom:10px;}
  .rating-rings{display:flex;justify-content:center;gap:10px;}
  .ring-btn{background:none;border:none;padding:4px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--muted);}
  .ring-btn:active{color:var(--brass-bright);}
  .ring-btn .ring-num{font-size:11px;}
  .rating-scale-hint{display:flex;justify-content:space-between;max-width:200px;margin:8px auto 0;font-size:11px;color:var(--muted);}
  .review-subhead{font-size:11px;text-transform:uppercase;letter-spacing:0.08em;color:var(--brass-bright);margin:12px 0 4px;}
  .review-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid rgba(255,255,255,0.06);font-size:13px;gap:10px;}
  .review-name{color:var(--text-light);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .review-score{color:var(--muted);flex-shrink:0;white-space:nowrap;}

  /* draw button + helper */
  .draw-btn{display:block;width:100%;padding:11px;font-size:14px;font-weight:600;letter-spacing:0.02em;background:linear-gradient(180deg,var(--brass-bright),var(--brass));color:var(--ink-deep);border:1px solid #6b4a1e;border-radius:10px;margin-bottom:4px;}
  .draw-btn:disabled{background:#2c2e29;color:var(--muted);border-color:var(--panel-border);}
  .draw-hint{font-size:11px;color:var(--muted);text-align:center;margin-bottom:10px;min-height:12px;}

  /* scheme reveal card - vertical, like a real card */
  .scheme-card{background:var(--parchment);color:var(--text-dark);border-radius:10px;overflow:hidden;box-shadow:0 14px 32px rgba(0,0,0,0.42);position:relative;border:1px solid rgba(43,36,22,0.25);display:flex;flex-direction:column;margin:14px 0 10px;}
  .scheme-card::after{content:'';position:absolute;inset:0;pointer-events:none;mix-blend-mode:multiply;background:
    radial-gradient(circle at 18% 82%, rgba(90,65,25,0.16) 0%, transparent 30%),
    radial-gradient(circle at 84% 14%, rgba(90,65,25,0.12) 0%, transparent 26%),
    radial-gradient(circle at 55% 94%, rgba(90,65,25,0.10) 0%, transparent 22%),
    radial-gradient(circle at 6% 28%, rgba(90,65,25,0.09) 0%, transparent 20%);}
  .scheme-card-name{font-family:var(--font-display);font-size:18px;padding:10px 14px 6px;background:linear-gradient(180deg,var(--parchment-hi),var(--parchment));flex:0 0 auto;}
  .scheme-card-name-text{}
  .scheme-card.special-one-ring{border:2px solid var(--brass-bright);box-shadow:0 0 30px rgba(216,174,102,0.55),0 14px 32px rgba(0,0,0,0.5);}
  .scheme-card.special-one-ring .scheme-card-name{background:linear-gradient(180deg,#1c0f05,#0d0602);}
  .scheme-card.special-one-ring .scheme-card-name-text{background-image:linear-gradient(180deg,#ffe29a,var(--brass-bright) 60%,#8a5a1e);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;text-shadow:0 0 10px rgba(255,200,100,0.5);}
  .scheme-card-art-wrap{width:100%;aspect-ratio:16/9;overflow:hidden;flex:0 0 auto;}
  .scheme-card-art{width:100%;height:100%;}
  .scheme-card-art svg,.scheme-card-art img{width:100%;height:100%;object-fit:cover;display:block;}
  .scheme-card-type{font-size:10px;text-transform:uppercase;letter-spacing:0.1em;font-weight:700;padding:6px 14px;background:var(--parchment);border-top:1px solid rgba(43,36,22,0.15);border-bottom:1px solid rgba(43,36,22,0.15);flex:0 0 auto;}
  .scheme-card-type.oneshot{color:var(--ember);}
  .scheme-card-type.ongoing{color:var(--moss);}
  .scheme-card-text{padding:10px 14px 16px;max-height:280px;overflow-y:auto;font-family:var(--font-body);font-size:14px;line-height:1.5;background:var(--parchment);white-space:pre-wrap;flex:0 0 auto;}
  .scheme-card-actions-row{margin:0 0 20px;}
  .scheme-card.reveal{animation:unfurl .55s cubic-bezier(.2,.7,.3,1) both;transform-origin:top center;}
  @keyframes unfurl{0%{transform:scaleY(.08);opacity:0}55%{transform:scaleY(1.04);opacity:1}100%{transform:scaleY(1);opacity:1}}
  @media (prefers-reduced-motion:reduce){.scheme-card.reveal{animation:none;}}
  .art-thumb{width:34px;height:24px;border-radius:4px;overflow:hidden;flex-shrink:0;border:1px solid var(--panel-border);}
  .art-thumb svg,.art-thumb img{width:100%;height:100%;object-fit:cover;display:block;}
  .art-box-form{width:100%;aspect-ratio:2/1;border-radius:8px;overflow:hidden;border:1px solid var(--panel-border);margin-top:6px;}
  .art-box-form svg,.art-box-form img{width:100%;height:100%;object-fit:cover;display:block;}
  .art-upload-actions{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;}
  .file-btn{display:inline-flex;align-items:center;justify-content:center;}
  .ongoing-item-main{display:flex;align-items:center;gap:8px;min-width:0;}

  /* ongoing + history */
  .section-label{font-size:11px;text-transform:uppercase;letter-spacing:0.13em;color:var(--muted);margin:18px 0 8px;}
  .ongoing-item{display:flex;justify-content:space-between;align-items:center;background:rgba(255,255,255,0.03);border:1px solid var(--panel-border);border-radius:9px;padding:10px 12px;margin-bottom:8px;font-size:14px;}
  details.history{margin-top:8px;}
  details.history summary{cursor:pointer;font-size:12px;color:var(--muted);letter-spacing:0.05em;list-style:none;}
  details.history summary::-webkit-details-marker{display:none;}
  details.history summary::before{content:'▸ ';}
  details.history[open] summary::before{content:'▾ ';}
  .history-item{font-size:13px;color:var(--text-light);opacity:0.85;padding:6px 0;border-bottom:1px solid rgba(255,255,255,0.06);}
  .deck-footer{font-size:12px;color:var(--muted);text-align:center;margin-top:18px;}
  .empty-note{font-size:13px;color:var(--muted);text-align:center;padding:24px 8px;line-height:1.6;}

  /* cards tab */
  .cards-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:10px;}
  .cards-header-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;}
  #bulk-text{width:100%;min-height:320px;background:rgba(0,0,0,0.25);border:1px solid var(--panel-border);border-radius:8px;color:var(--text-light);padding:12px;font-size:14px;line-height:1.5;margin-top:10px;}
  .bulk-actions{display:flex;gap:8px;margin-top:10px;}
  .bulk-actions button{flex:1;}
  .cards-count{font-size:12px;color:var(--muted);}
  .card-row{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,0.03);border:1px solid var(--panel-border);border-radius:10px;padding:12px 14px;margin-bottom:8px;}
  .card-row-main{display:flex;flex-direction:column;gap:4px;min-width:0;flex:1;}
  .card-row-badges{display:flex;gap:6px;flex-wrap:wrap;}
  .card-row-name{font-family:var(--font-display);font-size:15px;color:var(--parchment-hi);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .badge{font-size:10px;text-transform:uppercase;letter-spacing:0.08em;padding:2px 7px;border-radius:20px;width:fit-content;}
  .badge.oneshot{background:rgba(216,174,102,0.15);color:var(--brass-bright);}
  .badge.ongoing{background:rgba(75,107,58,0.25);color:var(--moss-bright);}
  .badge.first-turn{background:none;border:1px solid var(--ember);color:#e0a08f;}
  .badge.special{background:none;border:1px solid var(--brass-bright);color:var(--brass-bright);}
  .card-row-qty{font-size:13px;color:var(--muted);flex-shrink:0;}

  /* forms */
  .form-panel{background:rgba(255,255,255,0.03);border:1px solid var(--panel-border);border-radius:12px;padding:16px;margin-bottom:18px;}
  .form-panel label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px;margin-top:12px;}
  .form-panel label:first-child{margin-top:0;}
  .form-panel input[type=text],.form-panel input[type=number],.form-panel textarea{
    width:100%;background:rgba(0,0,0,0.25);border:1px solid var(--panel-border);border-radius:8px;color:var(--text-light);padding:10px 11px;font-size:15px;
  }
  .form-panel textarea{min-height:80px;resize:vertical;font-family:var(--font-body);}
  .type-toggle{display:flex;gap:8px;margin-top:6px;}
  .type-toggle button{flex:1;padding:9px 0;border-radius:8px;border:1px solid var(--panel-border);background:none;color:var(--muted);font-size:13px;}
  .type-toggle button.active{background:rgba(216,174,102,0.15);color:var(--brass-bright);border-color:var(--brass);}
  .form-actions{display:flex;gap:8px;margin-top:16px;}
  .form-actions button{flex:1;}

  /* rules tab */
  .rules-section{background:rgba(255,255,255,0.03);border:1px solid var(--panel-border);border-radius:12px;padding:16px;margin-bottom:16px;}
  .rules-row{display:flex;gap:10px;align-items:center;margin-top:10px;}
  .rules-row label{font-size:13px;color:var(--text-light);flex:1;}
  .rules-row input{width:70px;background:rgba(0,0,0,0.25);border:1px solid var(--panel-border);border-radius:8px;color:var(--text-light);padding:8px;font-size:15px;text-align:center;}
  .hint{font-size:12px;color:var(--muted);line-height:1.5;margin-top:10px;margin-bottom:14px;}
  .rules-section .btn{margin-top:10px;margin-right:8px;}
  #backup-out,#backup-in{width:100%;min-height:90px;background:rgba(0,0,0,0.25);border:1px solid var(--panel-border);border-radius:8px;color:var(--text-light);padding:10px;font-size:12px;font-family:monospace;margin-top:10px;}

  /* tab bar */
  .tabbar{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--ink-deep);border-top:1px solid var(--panel-border);padding-bottom:env(safe-area-inset-bottom);z-index:10;}
  .tabbar button{flex:1;padding:14px 0 12px;background:none;border:none;color:var(--muted);font-size:12px;letter-spacing:0.04em;}
  .tabbar button.active{color:var(--brass-bright);position:relative;}
  .tabbar button.active::after{content:'';position:absolute;bottom:3px;left:50%;transform:translateX(-50%);width:16px;height:2px;background:var(--brass-bright);border-radius:2px;}
  .loading{text-align:center;padding:60px 20px;color:var(--muted);font-size:14px;}
</style>
</head>
<body>
<div id="app"><div class="loading">Unrolling the scroll…</div></div>
<script>
(function(){
  "use strict";

  var LIB_KEY = 'scheme-library';
  var GAME_KEY = 'scheme-game';

  var library = null;
  var game = null;
  var activeTab = 'table';
  var cardForm = null;
  var pendingDeleteId = null;
  var pendingNewGame = false;
  var showBackup = false;
  var bulkMode = false;
  var showGameMenu = false;
  var justDrawnAnimation = false;
  var storageError = false;
  var reviewModeChecked = false;
  var selectedCommander = '';
  var commanderPickerOpen = false;
  var COMMANDER_LIST = [
    "Thorin, King of Durin's Folk",
    "The Great Goblin",
    "Gandalf, Party Guest",
    "Radagast of Rhosgobel",
    "\u00c9owyn, Shieldmaiden",
    "Frodo, Adventurous Hobbit & Sam, Loyal Attendant",
    "Arwen Und\u00f3miel",
    "Sauron, the Dark Lord"
  ];
  var pendingClearRatings = false;
  var STORAGE_MODE = 'local';
  try {
    if (typeof window.storage !== 'undefined' && window.storage && typeof window.storage.get === 'function'){
      STORAGE_MODE = 'claude';
    }
  } catch (e) { STORAGE_MODE = 'local'; }

  function withTimeout(promiseFactory, ms){
    return new Promise(function(resolve){
      var done = false;
      var timer = setTimeout(function(){ if (!done){ done = true; resolve({ __timedOut: true }); } }, ms);
      Promise.resolve().then(promiseFactory).then(function(v){
        if (!done){ done = true; clearTimeout(timer); resolve(v); }
      }, function(){
        if (!done){ done = true; clearTimeout(timer); resolve({ __timedOut: true }); }
      });
    });
  }

  async function storageGet(key){
    if (STORAGE_MODE === 'claude'){
      var result = await withTimeout(function(){ return window.storage.get(key); }, 2200);
      if (!result || result.__timedOut){ STORAGE_MODE = 'local'; }
      else { return result; }
    }
    try {
      var raw = localStorage.getItem(key);
      return raw ? { key: key, value: raw } : null;
    } catch (e) { return null; }
  }
  async function storageSet(key, value){
    if (STORAGE_MODE === 'claude'){
      var result = await withTimeout(function(){ return window.storage.set(key, value); }, 2200);
      if (!result || result.__timedOut){ STORAGE_MODE = 'local'; }
      else { return result; }
    }
    try { localStorage.setItem(key, value); return { key: key, value: value }; }
    catch (e) { return null; }
  }

  function uid(){ return Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4); }

  function esc(str){
    return String(str == null ? '' : str).replace(/[&<>"']/g, function(s){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s];
    });
  }

  function defaultLibrary(){
    return {
      cards: [],
      rules: { startTurn: 1, interval: 1 }
    };
  }
  function defaultGame(){
    return { turn: 1, started: false, deck: [], starterDeck: [], ongoing: [], drawnThisTurn: false, lastDrawn: null, history: [] };
  }

  function shuffle(arr){
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--){
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
  }

  // Seed IDs listed here are actively stripped from any saved library, even if already present.
  var REMOVED_SEED_IDS = ['seed-dwarven-prospectors-v1', 'seed-uruk-hai-reinforcements-v1'];

  var SEED_CARDS = [
    {
      seedId: 'seed-watcher-awakens-v1',
      name: 'The Watcher Awakens',
      text: 'When you set this scheme in motion, destroy up to two target creatures. For each creature that died this way, its controller creates a Food token.\n(Food is an artifact token with "{2}, {T}, Sacrifice this artifact: You gain 3 life.")',
      type: 'oneshot',
      qty: 1,
      art: '<svg viewBox="0 0 400 200" xmlns="http://www.w3.org/2000/svg"><defs><filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter><filter id="softer" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="12"/></filter><radialGradient id="bg" cx="55%" cy="20%" r="90%"><stop offset="0%" stop-color="#233326"/><stop offset="55%" stop-color="#0a120d"/><stop offset="100%" stop-color="#020402"/></radialGradient><linearGradient id="tent" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#3a4d2a"/><stop offset="100%" stop-color="#050805"/></linearGradient></defs><rect width="400" height="200" fill="url(#bg)"/><ellipse cx="200" cy="40" rx="220" ry="30" fill="#3a5540" opacity="0.25" filter="url(#softer)"/><path d="M70,200 C60,140 100,95 80,45 C95,60 115,110 130,150 C140,175 115,195 70,200 Z" fill="url(#tent)" filter="url(#soft)"/><path d="M320,200 C332,150 300,110 315,60 C300,80 285,125 275,160 C268,182 290,197 320,200 Z" fill="url(#tent)" filter="url(#soft)" opacity="0.92"/><path d="M200,200 C210,160 185,130 200,95 C188,112 178,148 182,175 C184,190 195,198 200,200 Z" fill="url(#tent)" filter="url(#soft)" opacity="0.85"/><circle cx="120" cy="70" r="2" fill="#c8e0a0" opacity="0.35"/><circle cx="260" cy="55" r="2.4" fill="#c8e0a0" opacity="0.3"/></svg>'

    catch (e) { game = defaultGame(); }
    if (!game || typeof game !== 'object' || !Array.isArray(game.deck) || !Array.isArray(game.ongoing) || !Array.isArray(game.history)) game = defaultGame();
    if (typeof game.started !== 'boolean'){
      game.started = (game.turn > 1) || game.history.length > 0 || game.ongoing.length > 0 || !!game.lastDrawn;
    }
    if (!game.turn || game.turn < 1) game.turn = 1;

    if (!library.seededIds) library.seededIds = [];
    var seededChanged = false;

    if (!library.onboardingRemoved){
      var beforeCount = library.cards.length;
      library.cards = library.cards.filter(function(c){
        return c.seedId || (c.name !== 'The Watcher Stirs' && c.name !== 'A Shadow Lingers');
      });
      library.onboardingRemoved = true;
      if (library.cards.length !== beforeCount) seededChanged = true;
    }

    // Migrate cards seeded before seedId/seedLocked tracking existed: link them by exact name match
    SEED_CARDS.forEach(function(seed){
      if (library.seededIds.indexOf(seed.seedId) === -1) return;
      var alreadyLinked = false;
      for (var i = 0; i < library.cards.length; i++){ if (library.cards[i].seedId === seed.seedId){ alreadyLinked = true; break; } }
      if (alreadyLinked) return;
      for (var j = 0; j < library.cards.length; j++){
        if (!library.cards[j].seedId && library.cards[j].name === seed.name){
          library.cards[j].seedId = seed.seedId;
          library.cards[j].seedLocked = false;
          seededChanged = true;
          break;
        }
      }
    });

    // Inject new seeds, and sync unlocked existing seeded cards to the latest definition
    SEED_CARDS.forEach(function(seed){
      var existing = null;
      for (var i = 0; i < library.cards.length; i++){ if (library.cards[i].seedId === seed.seedId){ existing = library.cards[i]; break; } }
      if (existing){
        if (!existing.seedLocked){
          var newArt = seed.art || null, newSpecial = seed.special || null, newFirst = !!seed.firstTurnOnly, newMinTurn = seed.minTurn || null;
          if (existing.name !== seed.name || existing.text !== seed.text || existing.type !== seed.type || existing.qty !== seed.qty || existing.art !== newArt || existing.firstTurnOnly !== newFirst || existing.special !== newSpecial || existing.minTurn !== newMinTurn){
            existing.name = seed.name; existing.text = seed.text; existing.type = seed.type; existing.qty = seed.qty;
            existing.art = newArt; existing.firstTurnOnly = newFirst; existing.special = newSpecial; existing.minTurn = newMinTurn;
            seededChanged = true;
          }
        }
      } else if (library.seededIds.indexOf(seed.seedId) === -1){
        library.cards.push({ id: uid(), seedId: seed.seedId, name: seed.name, text: seed.text, type: seed.type, qty: seed.qty, art: seed.art || null, firstTurnOnly: !!seed.firstTurnOnly, special: seed.special || null, minTurn: seed.minTurn || null, seedLocked: false });
        library.seededIds.push(seed.seedId);
        seededChanged = true;
      }
    });

    if (REMOVED_SEED_IDS.length > 0){
      var beforeRemoveCount = library.cards.length;
      library.cards = library.cards.filter(function(c){ return REMOVED_SEED_IDS.indexOf(c.seedId) === -1; });
      if (library.cards.length !== beforeRemoveCount) seededChanged = true;
    }
    if (seededChanged) saveLibrary();

    var starterMigrated = false;
    if (!Array.isArray(game.starterDeck)){
      game.starterDeck = [];
      var firstTurnCardIds = {};
      library.cards.forEach(function(c){ if (c.firstTurnOnly) firstTurnCardIds[c.id] = true; });
      var starterDeck = game.starterDeck, remaining = [];
      game.deck.forEach(function(inst){
        if (firstTurnCardIds[inst.cardId]){ starterDeck.push(inst); starterMigrated = true; } else remaining.push(inst);
      });
      game.deck = remaining;
    }

    var ids = {};
    library.cards.forEach(function(c){ ids[c.id] = true; });
    var deckBefore = game.deck.length, ongoingBefore = game.ongoing.length, starterBefore = game.starterDeck.length;
    game.deck = (game.deck || []).filter(function(i){ return ids[i.cardId]; });
    game.ongoing = (game.ongoing || []).filter(function(i){ return ids[i.cardId]; });
    game.starterDeck = (game.starterDeck || []).filter(function(i){ return ids[i.cardId]; });
    if (starterMigrated || game.deck.length !== deckBefore || game.ongoing.length !== ongoingBefore || game.starterDeck.length !== starterBefore) saveGame();

    if (game.deck.length === 0 && game.starterDeck.length === 0 && game.ongoing.length === 0 && library.cards.length > 0){
      rebuildDeck(false, false);
    }
    render();
  }

  async function saveLibrary(){
    try {
      var ok = await storageSet(LIB_KEY, JSON.stringify(library));
      storageError = !ok;
    } catch (e) { storageError = true; console.error('Arbeider Archenemy: save library failed', e); }
  }
  async function saveGame(){
    try {
      var ok = await storageSet(GAME_KEY, JSON.stringify(game));
      storageError = !ok;
    } catch (e) { storageError = true; console.error('Arbeider Archenemy: save game failed', e); }
  }

  function rebuildDeck(resetTurn, doRender){
    var firstInstances = [];
    var normalInstances = [];
    library.cards.forEach(function(c){
      var qty = Math.max(1, c.qty || 1);
      for (var i = 0; i < qty; i++){
        var inst = { id: uid(), cardId: c.id };
        if (c.firstTurnOnly) firstInstances.push(inst); else normalInstances.push(inst);
      }
    });
    game.starterDeck = shuffle(firstInstances);
    game.deck = shuffle(normalInstances);
    game.ongoing = [];
    game.drawnThisTurn = false;
    game.lastDrawn = null;
    game.history = [];
    if (resetTurn) game.turn = 1;
    saveGame();
    if (doRender !== false) render();
  }

  function isEligible(){
    var startTurn = library.rules.startTurn, interval = Math.max(1, library.rules.interval || 1);
    return game.turn >= startTurn && (game.turn - startTurn) % interval === 0;
  }
  function nextEligibleTurn(){
    var startTurn = library.rules.startTurn, interval = Math.max(1, library.rules.interval || 1);
    if (game.turn < startTurn) return startTurn;
    var rem = (game.turn - startTurn) % interval;
    return rem === 0 ? game.turn : game.turn + (interval - rem);
  }

  function activeDrawPool(){
    return (game.turn === 1 && game.starterDeck.length > 0) ? game.starterDeck : game.deck;
  }

  function findCardById(cardId){
    for (var i = 0; i < library.cards.length; i++){ if (library.cards[i].id === cardId) return library.cards[i]; }
    return null;
  }

  function findEligibleIndex(pool){
    for (var i = 0; i < pool.length; i++){
      var card = findCardById(pool[i].cardId);
      if (!card) continue;
      if (card.minTurn && game.turn < card.minTurn) continue;
      return i;
    }
    return -1;
  }

  function nextTurn(){ game.turn += 1; game.drawnThisTurn = false; saveGame(); render(); }
  function prevTurn(){ if (game.turn > 0){ game.turn -= 1; game.drawnThisTurn = false; saveGame(); render(); } }

  var audioCtx = null;
  function getAudioCtx(){
    if (!audioCtx){
      try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
      catch (e) { audioCtx = null; }
    }
    return audioCtx;
  }
  function playChime(){
    var ctx = getAudioCtx();
    if (!ctx) return;
    try {
      if (ctx.state === 'suspended') ctx.resume();
      var now = ctx.currentTime;
      var freqs = [523.25, 659.25, 783.99];
      freqs.forEach(function(freq, i){
        var osc = ctx.createOscillator();
        var gain = ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.value = freq;
        var startTime = now + i * 0.07;
        gain.gain.setValueAtTime(0, startTime);
        gain.gain.linearRampToValueAtTime(0.15, startTime + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.9);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(startTime);
        osc.stop(startTime + 1);
      });
    } catch (e) { /* ignore - sound is a nice-to-have, never block gameplay on it */ }
  }
  function toggleSound(){ library.soundEffects = (library.soundEffects === false); saveLibrary(); render(); }

  function drawScheme(){
    var pool = activeDrawPool();
    if (game.drawnThisTurn || !isEligible()) return;
    var idx = findEligibleIndex(pool);
    if (idx === -1) return;
    var drawn = pool.splice(idx, 1)[0];
    var card = findCardById(drawn.cardId);
    if (!card){ saveGame(); render(); return; }
    game.drawnThisTurn = true;
    game.lastDrawn = { instanceId: drawn.id, cardId: card.id, name: card.name, text: card.text, type: card.type, art: card.art || null, special: card.special || null };
    game.history.unshift({ turn: game.turn, name: card.name, type: card.type });
    if (card.type === 'ongoing'){ game.ongoing.push(drawn); }
    else if (!card.firstTurnOnly){ game.deck.push(drawn); }
    justDrawnAnimation = true;
    if (library.soundEffects !== false) playChime();
    saveGame();
    render();
  }

  function exportCardsAsText(){
    return library.cards.map(function(c){
      var lines = ['Name: ' + c.name, 'Type: ' + (c.type === 'ongoing' ? 'ongoing' : 'oneshot'), 'Qty: ' + (c.qty || 1)];
      if (c.firstTurnOnly) lines.push('First turn only: yes');
      if (c.minTurn) lines.push('Min turn: ' + c.minTurn);
      lines.push('Text: ' + (c.text || ''));
      return lines.join('\n');
    }).join('\n---\n');
  }

  function parseCardsText(text){
    var lines = text.replace(/\r\n/g, '\n').split('\n');
    var blocks = [[]];
    lines.forEach(function(line){
      if (/^-{3,}\s*$/.test(line.trim())){ blocks.push([]); }
      else { blocks[blocks.length - 1].push(line); }
    });
    var cards = [];
    blocks.forEach(function(blockLines){
      var name = '', type = 'oneshot', qty = 1, firstTurnOnly = false, minTurn = null, textLines = null;
      for (var i = 0; i < blockLines.length; i++){
        var line = blockLines[i];
        if (textLines !== null){ textLines.push(line); continue; }
        var mName = /^\s*Name\s*:\s*(.*)$/i.exec(line);
        var mType = /^\s*Type\s*:\s*(.*)$/i.exec(line);
        var mQty = /^\s*Qty\s*:\s*(.*)$/i.exec(line);
        var mFirst = /^\s*First turn only\s*:\s*(.*)$/i.exec(line);
        var mMinTurn = /^\s*Min turn\s*:\s*(.*)$/i.exec(line);
        var mText = /^\s*Text\s*:\s*(.*)$/i.exec(line);
        if (mName){ name = mName[1].trim(); }
        else if (mType){ type = /ongoing/i.test(mType[1]) ? 'ongoing' : 'oneshot'; }
        else if (mQty){ qty = Math.max(1, parseInt(mQty[1], 10) || 1); }
        else if (mFirst){ firstTurnOnly = /^(yes|true|1)$/i.test(mFirst[1].trim()); }
        else if (mMinTurn){ var mt = parseInt(mMinTurn[1], 10); minTurn = mt > 1 ? mt : null; }
        else if (mText){ textLines = [mText[1]]; }
      }
      var cardText = textLines ? textLines.join('\n').trim() : '';
      name = name.trim();
      if (name){ cards.push({ name: name, type: type, qty: qty, firstTurnOnly: firstTurnOnly, minTurn: minTurn, text: cardText }); }
    });
    return cards;
  }

  function saveBulkCards(){
    var el = document.getElementById('bulk-text');
    if (!el) return;
    var parsed = parseCardsText(el.value);
    if (parsed.length === 0){
      alert('No cards found. Make sure each card has a Name: line, with cards separated by a line of ---.');
      return;
    }
    var existingByName = {};
    library.cards.forEach(function(c){ existingByName[(c.name || '').trim().toLowerCase()] = c; });
    library.cards = parsed.map(function(p){
      var match = existingByName[p.name.toLowerCase()];
      return { id: match ? match.id : uid(), name: p.name, type: p.type, qty: p.qty, firstTurnOnly: !!p.firstTurnOnly, minTurn: p.minTurn || null, text: p.text, art: match ? (match.art || null) : null, special: match ? (match.special || null) : null, seedId: match ? (match.seedId || null) : null, seedLocked: !!match };
    });
    var ids = {};
    library.cards.forEach(function(c){ ids[c.id] = true; });
    game.deck = game.deck.filter(function(i){ return ids[i.cardId]; });
    game.ongoing = game.ongoing.filter(function(i){ return ids[i.cardId]; });
    game.starterDeck = game.starterDeck.filter(function(i){ return ids[i.cardId]; });
    saveLibrary(); saveGame();
    bulkMode = false;
    render();
  }

  function downscaleImage(dataUrl, maxWidth, quality){
    return new Promise(function(resolve){
      var img = new Image();
      img.onload = function(){
        var scale = Math.min(1, maxWidth / img.width);
        var w = Math.max(1, Math.round(img.width * scale));
        var h = Math.max(1, Math.round(img.height * scale));
        var canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        var ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        try { resolve(canvas.toDataURL('image/jpeg', quality)); }
        catch (e) { resolve(dataUrl); }
      };
      img.onerror = function(){ resolve(dataUrl); };
      img.src = dataUrl;
    });
  }
  function onArtFileSelected(input){
    var file = input.files && input.files[0];
    if (!file || !cardForm) return;
    var reader = new FileReader();
    reader.onload = function(){
      syncFormFromDOM();
      downscaleImage(reader.result, 520, 0.82).then(function(small){
        cardForm.art = small;
        render();
      });
    };
    reader.readAsDataURL(file);
  }
  function removeArt(){ if (!cardForm) return; syncFormFromDOM(); cardForm.art = null; render(); }

  function renderHeader(){
    var gearBtn = (game && game.started) ? '<button class="gear-btn" onclick="App.toggleGameMenu()" aria-label="Game menu">⚙</button>' : '';
    var subtitle = (game && game.started && game.commander) ? 'Archenemy: ' + esc(game.commander) : 'a scheme-keeper for Middle-earth game night';
    var html = '<div class="topbar">' +
      '<div class="topbar-left"><div class="seal-mini">' + logoSVG(38) + '</div>' +
      '<div><div class="app-title">Arbeider Archenemy</div><div class="app-subtitle">' + subtitle + '</div></div></div>' +
      gearBtn +
      '</div>';
    if (showGameMenu && game && game.started){
      html += '<div class="game-menu">';
      html += '<button class="btn btn-danger" onclick="App.confirmNewGame()">' + (pendingNewGame ? 'Confirm restart?' : 'Restart') + '</button>';
      html += '<button class="btn btn-ghost" onclick="App.goToMainMenu()">Return to main menu</button>';
      html += '</div>';
    }
    return html;
  }

  function renderTabBar(){
    function tab(id, label){ return '<button class="' + (activeTab === id ? 'active' : '') + '" onclick="App.switchTab(\'' + id + '\')">' + label + '</button>'; }
    return '<div class="tabbar">' + tab('table', 'Table') + tab('cards', 'Cards') + tab('rules', 'Rules') + '</div>';
  }

  function renderStartScreen(){
    var html = '<div class="start-screen">';
    html += logoSVG(64);
    html += '<div class="start-title">Ready when you are</div>';
    html += '<div class="start-sub">' + library.cards.length + ' scheme' + (library.cards.length === 1 ? '' : 's') + ' in your deck</div>';
    if (library.cards.length === 0){
      html += '<div class="empty-note">Add some schemes in the Cards tab first.</div>';
    } else {
      html += '<label class="commander-label">Archenemy\'s commander</label>';
      html += '<button class="commander-picker-btn" onclick="App.toggleCommanderPicker()"><span>' + (selectedCommander ? esc(selectedCommander) : 'Choose a commander…') + '</span><span class="picker-chevron">' + (commanderPickerOpen ? '▲' : '▼') + '</span></button>';
      if (commanderPickerOpen){
        html += '<div class="commander-picker-list">';
        COMMANDER_LIST.forEach(function(name, idx){
          html += '<button class="commander-picker-option' + (selectedCommander === name ? ' active' : '') + '" onclick="App.selectCommanderByIndex(' + idx + ')">' + esc(name) + '</button>';
        });
        html += '</div>';
      }
      html += renderSwitch(reviewModeChecked, 'App.toggleReviewModeChecked()', 'Rate scheme power this game');
      html += '<div class="hint">If on, after resolving each scheme you\'ll rate how strong it felt. Ratings are saved so you can review and rebalance later, in the Rules tab.</div>';
      html += '<button class="btn btn-primary btn-block" ' + (selectedCommander ? '' : 'disabled') + ' onclick="App.startGame()">Start New Game</button>';
      if (!selectedCommander) html += '<div class="hint">Choose a commander to continue.</div>';
    }
    html += '</div>';
    return html;
  }

  function renderTable(){
    if (!game.started){ return renderStartScreen(); }
    var html = '';
    var eligible = isEligible();
    html += '<div class="control-bar">';
    html += '<div class="turn-mini"><button class="mini-btn" onclick="App.prevTurn()">−</button><span class="turn-mini-label">Turn <strong>' + game.turn + '</strong></span><button class="mini-btn" onclick="App.nextTurn()">+</button></div>';
    html += '<div class="eligibility-mini ' + (eligible ? 'lit' : 'unlit') + '">' + (eligible ? '● Ready' : '○ Turn ' + nextEligibleTurn()) + '</div>';
    html += '</div>';

    if (library.cards.length === 0){
      html += '<div class="empty-note">No schemes yet. Add some in the Cards tab.</div>';
    } else {
      var pool = activeDrawPool();
      var eligibleIdx = findEligibleIndex(pool);
      var disabled = !eligible || game.drawnThisTurn || eligibleIdx === -1;
      html += '<button class="draw-btn" ' + (disabled ? 'disabled' : '') + ' onclick="App.drawScheme()">Draw a Scheme</button>';
      var hint = '';
      if (!eligible) hint = 'Not eligible this turn.';
      else if (game.drawnThisTurn) hint = 'Resolve the scheme above to continue.';
      else if (pool.length === 0) hint = 'No schemes left. Abandon an ongoing scheme, or reshuffle in Rules.';
      else if (eligibleIdx === -1) hint = 'No eligible schemes yet — something in the deck unlocks later.';
      if (hint) html += '<div class="draw-hint">' + hint + '</div>';

      if (game.lastDrawn){
        var d = game.lastDrawn;
        var revealClass = '';
        if (justDrawnAnimation){ revealClass = 'reveal'; justDrawnAnimation = false; }
        var specialClass = d.special ? ' special-' + d.special : '';
        html += '<div class="scheme-card ' + revealClass + specialClass + '">';
        html += '<div class="scheme-card-name"><span class="scheme-card-name-text">' + esc(d.name) + '</span></div>';
        html += '<div class="scheme-card-art-wrap">' + renderArtBox(d.art, 'card') + '</div>';
        html += '<div class="scheme-card-type ' + d.type + '">' + (d.type === 'ongoing' ? 'Scheme — Ongoing' : 'Scheme') + '</div>';
        html += '<div class="scheme-card-text">' + esc(d.text) + '</div>';
        html += '</div>';
        if (d.awaitingRating){
          html += renderRatingPrompt();
        } else {
          html += '<div class="scheme-card-actions-row"><button class="btn btn-primary btn-block" onclick="App.dismissLastDrawn()">' + (d.type === 'ongoing' ? 'Set in Play → Next Turn' : 'Resolved → Next Turn') + '</button></div>';
        }
      }

      if (game.ongoing.length > 0){
        html += '<div class="section-label">In play (' + game.ongoing.length + ')</div>';
        game.ongoing.forEach(function(o){
          var card = null;
          for (var i = 0; i < library.cards.length; i++){ if (library.cards[i].id === o.cardId){ card = library.cards[i]; break; } }
          if (!card) return;
          html += '<div class="ongoing-item"><div class="ongoing-item-main">' + renderArtBox(card.art, 'thumb') + '<span>' + esc(card.name) + '</span></div><button class="btn btn-ghost" onclick="App.abandonOngoing(\'' + o.id + '\')">Abandon</button></div>';
        });
      }

      if (game.history.length > 0){
        html += '<details class="history"><summary>Scroll of deeds (' + game.history.length + ')</summary>';
        game.history.slice(0, 30).forEach(function(h){
          html += '<div class="history-item">Turn ' + h.turn + ' — ' + esc(h.name) + (h.type === 'ongoing' ? ' (ongoing)' : '') + '</div>';
        });
        html += '</details>';
      }

      var deckCount = game.deck.length + (game.turn === 1 ? game.starterDeck.length : 0);
      html += '<div class="deck-footer">' + deckCount + ' in deck · ' + game.ongoing.length + ' in play' + (game.reviewMode ? ' · rating on' : '') + '</div>';
    }
    return html;
  }

  function renderCards(){
    var html = '';
    var totalCopies = 0;
    library.cards.forEach(function(c){ totalCopies += Math.max(1, c.qty || 1); });

    html += '<div class="cards-header"><div class="cards-count">' + library.cards.length + ' schemes · ' + totalCopies + ' copies in deck</div>';
    html += '<div class="cards-header-actions"><button class="btn btn-ghost" onclick="App.toggleBulk()">' + (bulkMode ? 'Close bulk edit' : 'Bulk edit') + '</button>';
    if (!bulkMode) html += '<button class="btn btn-primary" onclick="App.openCardForm()">+ Add scheme</button>';
    html += '</div></div>';

    if (bulkMode){
      html += '<div class="form-panel">';
      html += '<div class="hint">One card per block: Name / Type / Qty / Text, separated by a line of three dashes (---). Add a line "First turn only: yes" to mark a card as guaranteed-first-draw. Art is not shown here — saving matches cards by name to keep any art already attached.</div>';
      html += '<textarea id="bulk-text">' + esc(exportCardsAsText()) + '</textarea>';
      html += '<div class="bulk-actions"><button class="btn btn-primary" onclick="App.saveBulkCards()">Save all</button><button class="btn btn-ghost" onclick="App.toggleBulk()">Cancel</button></div>';
      html += '</div>';
      return html;
    }

    if (cardForm){
      var f = cardForm;
      html += '<div class="form-panel">';
      html += '<label>Name</label><input type="text" id="cf-name" value="' + esc(f.name) + '" placeholder="e.g. The Ring Calls">';
      html += '<label>Art</label>';
      html += renderArtBox(f.art, 'form');
      html += '<div class="art-upload-actions">';
      html += '<label class="btn btn-ghost file-btn">Choose photo<input type="file" accept="image/png,image/jpeg,image/webp,image/gif" style="display:none" onchange="App.onArtFileSelected(this)"></label>';
      if (f.art) html += '<button class="btn btn-ghost" onclick="App.removeArt()">Remove art</button>';
      html += '</div>';
      html += '<label>Effect text</label><textarea id="cf-text" placeholder="What happens when this scheme is set in motion?">' + esc(f.text) + '</textarea>';
      html += '<label>Type</label><div class="type-toggle">';
      html += '<button class="' + (f.type === 'oneshot' ? 'active' : '') + '" onclick="App.setFormType(\'oneshot\')">Scheme</button>';
      html += '<button class="' + (f.type === 'ongoing' ? 'active' : '') + '" onclick="App.setFormType(\'ongoing\')">Ongoing</button>';
      html += '</div>';
      html += '<label>Copies in deck</label><input type="number" id="cf-qty" min="1" max="10" value="' + (f.qty || 1) + '">';
      html += '<label>Special timing</label>' + renderSwitch(f.firstTurnOnly, 'App.toggleFirstTurnOnly()', 'First turn only');
      html += '<div class="hint">If on, this scheme is guaranteed to be the first one drawn each game, then set aside for the rest of that game instead of returning to the deck.</div>';
      html += '<label>Minimum turn (optional)</label><input type="number" id="cf-minturn" min="1" placeholder="e.g. 3" value="' + (f.minTurn || '') + '">';
      html += '<div class="hint">Leave blank for no restriction. If set, this scheme stays in the deck but can\'t be drawn before that turn.</div>';
      html += '<div class="form-actions">';
      html += '<button class="btn btn-primary" onclick="App.saveCardForm()">Save</button>';
      if (f.id){ html += '<button class="btn btn-danger" onclick="App.deleteCardConfirm(\'' + f.id + '\')">' + (pendingDeleteId === f.id ? 'Confirm delete?' : 'Delete') + '</button>'; }
      html += '<button class="btn btn-ghost" onclick="App.closeCardForm()">Cancel</button>';
      html += '</div></div>';
    }

    if (library.cards.length === 0 && !cardForm){
      html += '<div class="empty-note">No schemes yet. Tap "Add scheme" to write your first one.</div>';
    } else {
      library.cards.forEach(function(c){
        html += '<div class="card-row" onclick="App.openCardForm(\'' + c.id + '\')">';
        html += renderArtBox(c.art, 'thumb');
        html += '<div class="card-row-main"><div class="card-row-badges"><span class="badge ' + c.type + '">' + (c.type === 'ongoing' ? 'Ongoing' : 'Scheme') + '</span>' + (c.firstTurnOnly ? '<span class="badge first-turn">Turn 1</span>' : '') + (c.minTurn ? '<span class="badge first-turn">Turn ' + c.minTurn + '+</span>' : '') + (c.special ? '<span class="badge special">★ Special</span>' : '') + '</div><span class="card-row-name">' + esc(c.name) + '</span></div>';
        html += '<div class="card-row-qty">×' + (c.qty || 1) + '</div>';
        html += '</div>';
      });
      html += '<div class="hint">New or edited schemes join the deck next time you reshuffle (see Rules tab).</div>';
    }
    return html;
  }

  function confirmClearRatings(){
    if (pendingClearRatings){
      library.ratings = [];
      saveLibrary();
      pendingClearRatings = false;
    } else {
      pendingClearRatings = true;
    }
    render();
  }

  function renderPowerReviews(){
    var ratings = library.ratings || [];
    if (ratings.length === 0) return '';
    var byCard = {};
    ratings.forEach(function(r){
      if (!byCard[r.cardId]) byCard[r.cardId] = { name: r.name, scores: [] };
      byCard[r.cardId].scores.push(r.score);
    });
    var cardRows = Object.keys(byCard).map(function(cardId){
      var entry = byCard[cardId];
      var currentCard = findCardById(cardId);
      var displayName = currentCard ? currentCard.name : entry.name + ' (removed)';
      var sum = entry.scores.reduce(function(a, b){ return a + b; }, 0);
      return { name: displayName, avg: sum / entry.scores.length, count: entry.scores.length };
    });
    cardRows.sort(function(a, b){ return a.avg - b.avg; });

    var byCommander = {};
    ratings.forEach(function(r){
      var key = r.commander || 'Not recorded';
      if (!byCommander[key]) byCommander[key] = [];
      byCommander[key].push(r.score);
    });
    var commanderRows = Object.keys(byCommander).map(function(name){
      var scores = byCommander[name];
      var sum = scores.reduce(function(a, b){ return a + b; }, 0);
      return { name: name, avg: sum / scores.length, count: scores.length };
    });
    commanderRows.sort(function(a, b){ return b.avg - a.avg; });

    var html = '<div class="rules-section">';
    html += '<div class="section-label">Power reviews (' + ratings.length + ' rating' + (ratings.length === 1 ? '' : 's') + ')</div>';
    if (commanderRows.length > 0){
      html += '<div class="review-subhead">By commander (strongest-feeling first)</div>';
      commanderRows.forEach(function(row){
        html += '<div class="review-row"><span class="review-name">' + esc(row.name) + '</span><span class="review-score">' + row.avg.toFixed(1) + ' avg · ' + row.count + 'x</span></div>';
      });
    }
    html += '<div class="review-subhead">By card (weakest first)</div>';
    cardRows.forEach(function(row){
      html += '<div class="review-row"><span class="review-name">' + esc(row.name) + '</span><span class="review-score">' + row.avg.toFixed(1) + ' avg · ' + row.count + 'x</span></div>';
    });
    html += '<button class="btn btn-danger" onclick="App.confirmClearRatings()">' + (pendingClearRatings ? 'Confirm clear?' : 'Clear all ratings') + '</button>';
    html += '<div class="hint">Ratings are included in your backup code.</div>';
    html += '</div>';
    return html;
  }

  function renderRules(){
    var html = '';
    html += '<div class="rules-section">';
    html += '<div class="section-label">Draw timing</div>';
    html += '<div class="rules-row"><label>First eligible turn</label><input type="number" id="rule-start" min="0" value="' + library.rules.startTurn + '"></div>';
    html += '<div class="rules-row"><label>Then draw every … turn(s)</label><input type="number" id="rule-interval" min="1" value="' + library.rules.interval + '"></div>';
    html += '<button class="btn btn-primary" onclick="App.saveRules()">Save timing</button>';
    html += '<div class="hint">1 and 1 draws every turn from the start (classic Archenemy). 2 and 1 skips turn 1, then draws every turn after. 5 and 5 draws only on turns 5, 10, 15…</div>';
    html += '</div>';

    html += '<div class="rules-section">';
    html += '<div class="section-label">Deck</div>';
    html += '<button class="btn btn-ghost" onclick="App.reshuffleNow()">Reshuffle deck</button>';
    html += '<div class="hint">Reshuffle keeps the turn count and just remixes the deck. To restart or end the current game, use the ⚙ menu at the top of the Table tab.</div>';
    html += '</div>';

    html += '<div class="rules-section">';
    html += '<div class="section-label">Sound</div>';
    html += renderSwitch(library.soundEffects !== false, 'App.toggleSound()', 'Sound effects');
    html += '<div class="hint">A short chime plays when you draw a scheme.</div>';
    html += '</div>';

    html += renderPowerReviews();

    html += '<div class="rules-section">';
    html += '<div class="section-label">Backup</div>';
    html += '<div class="hint">Saving to: ' + (STORAGE_MODE === 'claude' ? 'your Claude account' : 'this browser, on this device') + '. ' + (STORAGE_MODE === 'local' ? 'Nothing is sent anywhere — use a backup code to move your deck to another phone or share it with someone else.' : '') + '</div>';
    html += '<button class="btn btn-ghost" onclick="App.toggleBackup()">' + (showBackup ? 'Hide' : 'Show') + ' backup code</button>';
    if (showBackup){
      var dump = JSON.stringify({ library: library, game: game });
      html += '<textarea id="backup-out" readonly onclick="this.select()">' + esc(dump) + '</textarea>';
      html += '<button class="btn btn-ghost" onclick="App.copyBackup()">Copy</button>';
      html += '<div class="hint">Copy this somewhere safe. To restore on another device, paste a backup below and tap Restore — this replaces everything currently saved.</div>';
      html += '<textarea id="backup-in" placeholder="Paste backup code here"></textarea>';
      html += '<button class="btn btn-primary" onclick="App.doImport()">Restore from code</button>';
    }
    html += '</div>';

    if (storageError){
      html += '<div class="hint">Heads up: changes could not be saved just now. Keep this tab open, or copy a backup code above so nothing is lost.</div>';
    }
    return html;
  }

  function render(){
    var app = document.getElementById('app');
    var body = activeTab === 'table' ? renderTable() : activeTab === 'cards' ? renderCards() : renderRules();
    app.innerHTML = renderHeader() + body + renderTabBar();
  }

  window.App = {
    switchTab: switchTab, nextTurn: nextTurn, prevTurn: prevTurn, drawScheme: drawScheme,
    dismissLastDrawn: dismissLastDrawn, abandonOngoing: abandonOngoing,
    openCardForm: openCardForm, closeCardForm: closeCardForm, setFormType: setFormType,
    saveCardForm: saveCardForm, deleteCardConfirm: deleteCardConfirm, saveRules: saveRules,
    confirmNewGame: confirmNewGame, reshuffleNow: reshuffleNow, toggleBackup: toggleBackup,
    copyBackup: copyBackup, doImport: doImport, onArtFileSelected: onArtFileSelected, removeArt: removeArt,
    toggleBulk: toggleBulk, saveBulkCards: saveBulkCards, startGame: startGame,
    toggleFirstTurnOnly: toggleFirstTurnOnly,
    toggleCommanderPicker: toggleCommanderPicker, selectCommanderByIndex: selectCommanderByIndex, toggleSound: toggleSound,
    toggleReviewModeChecked: toggleReviewModeChecked, rateLastDrawn: rateLastDrawn, confirmClearRatings: confirmClearRatings,
    toggleGameMenu: toggleGameMenu, goToMainMenu: goToMainMenu
  };

  var appStarted = false;
  loadAll().then(function(){ appStarted = true; }).catch(function(e){
    console.error('Arbeider Archenemy: loadAll failed', e);
    if (!library) library = defaultLibrary();
    if (!game) game = defaultGame();
    storageError = true;
    appStarted = true;
    render();
  });
  setTimeout(function(){
    if (!appStarted){
      console.error('Arbeider Archenemy: load timed out, forcing a fallback render');
      if (!library) library = defaultLibrary();
      if (!game) game = defaultGame();
      storageError = true;
      appStarted = true;
      render();
    }
  }, 6000);
})();
</script>
</body>
</html>
